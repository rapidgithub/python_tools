name: PR Approver

on:
  workflow_run:
    workflows: ["Pylint"]
    types:
      - completed

permissions:
  pull-requests: write
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Approve PR on successful checks
        uses: actions/github-script@v7
        with:
          script: |
            // Get the PR associated with this workflow run
            const prs = await github.rest.pulls.listFromRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            // Find the PR that triggered this workflow
            const pr = prs.data.find(pull => {
              return pull.head.sha === context.payload.workflow_run.head_commit.id;
            });

            if (!pr) {
              console.log('No open PR found for this commit');
              return;
            }

            // Check if already approved
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const hasApproval = reviews.data.some(review => review.state === 'APPROVED');
            
            if (hasApproval) {
              console.log(`PR #${pr.number} already approved`);
              return;
            }

            // Approve the PR
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: '✅ Automated approval: All checks passed successfully.',
            });

            console.log(`✅ PR #${pr.number} approved`);
